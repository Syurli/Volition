name: Agent Recovery Geometry Migration

on:
  push:
    branches:
      - agent/recovery-geometry-tactical-clarity

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/recovery-geometry-tactical-clarity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply recovery geometry migration
        run: |
          sed -i "/if (content.indexOf(search, index + search.length) >= 0) throw new Error/d" Scripts/agent-recovery-geometry.mjs
          node Scripts/agent-recovery-geometry.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Apps/Workbench/src/simulation/tacticalWizardRuntime.ts')
          text = path.read_text()
          old = "    readonly shotsRecent: number;\n    readonly firePressure: number;\n  };\n  readonly tacticalEffect:"
          new = "    readonly shotsRecent: number;\n    readonly firePressure: number;\n    readonly shotBlockedByWorld: boolean;\n  };\n  readonly tacticalEffect:"
          if old not in text:
              raise SystemExit('playerCombat public state anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Validate migration
        run: npm run build
      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apps/Workbench/src/simulation Apps/Workbench/src/components/SimulationRecoveryCanvas.tsx Apps/Workbench/src/simulation-runtime.css Tests/workbench/recoveryGeometryAndShotTrace.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Unify rescue geometry and tactical execution"
          git push origin HEAD:agent/recovery-geometry-tactical-clarity
