name: Recovery R4 Geometry Invariant Fix

on:
  push:
    branches:
      - agent/recovery-r4-capability-arbitration-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Enforce valid geometry before active Recovery ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce Recovery geometry invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Apps/Workbench/src/simulation/tacticalWizardRuntime.ts')
          s = p.read_text()
          old = "    if (!geometryReady && this.recoveryThreatPoint(state) !== null) this.deferRecovery(state, 'no viable covered treatment geometry at recovery start');"
          new = "    if (!geometryReady) this.deferRecovery(state, 'Recovery cannot own execution without viable treatment / security geometry');"
          if s.count(old) != 1:
              raise SystemExit(f'expected one geometry invariant anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit runtime invariant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apps/Workbench/src/simulation/tacticalWizardRuntime.ts
          git diff --cached --quiet && exit 0
          git commit -m "Enforce valid geometry before active Recovery ownership"
          git push
