name: Deploy Willform Workbench to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build and validate production Workbench
        env:
          WILLFORM_BASE_PATH: /Willform/
          WILLFORM_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Upload Workbench artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Apps/Workbench/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Workbench
        id: deployment
        uses: actions/deploy-pages@v4
