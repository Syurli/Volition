name: One-time Willform brand migration

on:
  push:
    branches:
      - agent/rename-volition-to-willform

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rename-volition-to-willform
          fetch-depth: 0
      - name: Replace legacy brand across tracked text and paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_tokens = ('VOLITION', 'Volition', 'volition')
          replacements = {'VOLITION': 'WILLFORM', 'Volition': 'Willform', 'volition': 'willform'}

          for path in [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old in old_tokens:
                  updated = updated.replace(old, replacements[old])
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          for path in sorted(files, key=lambda p: len(p.parts), reverse=True):
              new_name = path.name
              for old in old_tokens:
                  new_name = new_name.replace(old, replacements[old])
              if new_name != path.name:
                  target = path.with_name(new_name)
                  if target.exists():
                      raise RuntimeError(f'Path collision: {path} -> {target}')
                  path.rename(target)

          dirs = [p for p in root.rglob('*') if p.is_dir() and '.git' not in p.parts]
          for path in sorted(dirs, key=lambda p: len(p.parts), reverse=True):
              if not path.exists():
                  continue
              new_name = path.name
              for old in old_tokens:
                  new_name = new_name.replace(old, replacements[old])
              if new_name != path.name:
                  target = path.with_name(new_name)
                  if target.exists():
                      raise RuntimeError(f'Path collision: {path} -> {target}')
                  path.rename(target)

          remaining = []
          for path in [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(token in text for token in old_tokens):
                  remaining.append(str(path))
          if remaining:
              raise RuntimeError('Legacy brand remains in: ' + ', '.join(remaining))
          PY
      - name: Commit migrated tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining migration changes."
          else
            git commit -m "Complete Willform brand migration"
            git push origin HEAD:agent/rename-volition-to-willform
          fi
