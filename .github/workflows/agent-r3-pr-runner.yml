name: Agent R3 PR Runner

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.head_ref == 'agent/recovery-planner-r3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:.github/agent-r3-patch.py > /tmp/agent-r3-patch.py
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Apply R3 patch
        run: python /tmp/agent-r3-patch.py
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit validated R3 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apps/Workbench/src/simulation/tacticalWizardRuntime.ts \
                  Apps/Workbench/src/simulation/tacticalWizardAdaptive.ts \
                  Apps/Workbench/src/simulation/CURRENT_RUNTIME.md \
                  Docs/Architecture/IAUS_UTILITY_REASONER.md \
                  Tests/workbench/recoveryAndPlannerTransactionsR3.test.ts \
                  CHANGELOG.md
          git diff --cached --check
          git commit -m "Fix recovery authority and transactional IAUS planning [agent-r3-done]"
          git push origin HEAD:${{ github.head_ref }}
