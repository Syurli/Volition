      ?? before.agents.find((agent) => agent.alive)!.id;
    const internal = simulation as unknown as {
      tryCommitPressureCandidate: (state: typeof before, action: 'reposition', agentId: string, score: number, reason: string) => { accepted: boolean; expectedTactic: string | null; target: { x: number; y: number } | null };
      commitPressureLease: (state: typeof before, attempt: unknown, agentId: string, reason: string) => void;
    };
    const attempt = internal.tryCommitPressureCandidate(before, 'reposition', pressuredAgent, 1, 'local-reposition-test');
    expect(attempt.accepted).toBe(true);
    expect(attempt.expectedTactic).toBe(before.squad.tactic);
    internal.commitPressureLease(before, attempt, pressuredAgent, 'local-reposition-test');
    const after = simulation.getState();
    expect(after.squad.tactic).toBe(before.squad.tactic);
    expect(after.adaptiveCombat.activeResponseLease?.action).toBe('reposition');
    expect(after.adaptiveCombat.activeResponseLease?.expectedTactic).toBe(before.squad.tactic);
    expect(after.agents.find((agent) => agent.id === pressuredAgent)?.tacticalTarget).toEqual(attempt.target);
