    const before = simulation.getState();
    expect(before.squad.alertState).toBe('active');
    const pressuredAgent = before.agents.find((agent) => agent.alive)!.id;
    const internal = simulation as unknown as {
      tryCommitPressureCandidate: (state: typeof before, action: 'flank', agentId: string, score: number, reason: string) => unknown;
