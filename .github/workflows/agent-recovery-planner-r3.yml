          if marker not in current_text:
              current_text += r'''

## Recovery Authority / Transactional IAUS R3

- Recovery ownership is validated before Safety pause/reposition/defer. A dead or medically incapable rescuer is reassigned immediately; if no capable living rescuer exists, Recovery releases execution ownership instead of suspending Tactical Planning forever.
- Security-only failures replan only Security geometry. Safe Treatment geometry is retained with hysteresis until it becomes exposed, unreachable, or is invalidated by a genuine treatment-progress failure.
- A covered treatment side may continue through residual `pressured` history; Safety pause moves the rescuer toward the fallback instead of producing a null movement owner, and deferral preserves treatment progress.
- IAUS candidate validation is transactional: Tactical Host state, plan revision, roles, targets, events, logs, and execution contracts are restored after Preview. Only the winning candidate reaches Commit.
- `local_reposition` is a single-member Tactical Planning lease. It preserves the current squad doctrine and reseeds that doctrine after arrival; it no longer aliases a squad-wide `regroup`.
- Mature Crossfire/Assault geometry resists whole-plan pressure switches unless pressure reaches `pinned` or the established geometry/fire lanes have materially degraded.
'''
              current_runtime.write_text(current_text)

          iaus_doc = Path('Docs/Architecture/IAUS_UTILITY_REASONER.md')
          iaus_text = iaus_doc.read_text()
          marker = '## R3: Preview → Commit Transaction Boundary'
          if marker not in iaus_text:
              iaus_text += r'''

## R3: Preview → Commit Transaction Boundary

IAUS still ranks Opportunities only. Candidate geometry is now evaluated inside a Tactical Planning transaction: Preview may temporarily exercise the reference Host planner, but all tactic/role/target/plan-revision/log/contract mutations are rolled back before the next candidate is evaluated. The selected winner is then committed once.

`local_reposition` is deliberately not implemented as `regroup`. The pressured member receives one planner-owned local target while the existing Bounding/Flank/Crossfire/Assault doctrine remains authoritative. On arrival, Tactical Planning reseeds the same doctrine from the new position.

This boundary is a regression requirement: a rejected IAUS candidate must be observationally equivalent to never having been proposed.
'''
              iaus_doc.write_text(iaus_text)

          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text()
          marker = 'Recovery authority and transactional IAUS planning R3'
          if marker not in change_text:
              first_newline = change_text.find('\n')
              insert = r'''

## Recovery authority and transactional IAUS planning R3

- Fixed stale/dead Recovery rescuer ownership during Safety pause/defer and all-downed squad deadlock.
- Scoped Recovery security/treatment replans, retained safe treatment geometry and medical progress, and allowed covered treatment through residual pressure.
- Made IAUS Tactical Planner validation transactional and replaced squad-wide Regroup masquerading as local reposition with a true single-member planner lease.
